worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
}
  # WebSocket upgrade map
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream fraudshield_api {
    server api:8000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # ── Frontend static files ─────────────────────────────────
    root /usr/share/nginx/html;
    index pages/index.html;
  }
    location / {
      try_files $uri $uri/ /pages/index.html;
    }

    # ── REST API ──────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://fraudshield_api;
      proxy_http_version 1.1;
      proxy_set_header   Host             $host;
      proxy_set_header   X-Real-IP        $remote_addr;
      proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_read_timeout 60s;
    }

    # ── WebSocket streaming ────────────────────────────────────
    location /api/v1/stream/ws {
      proxy_pass         http://fraudshield_api;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host       $host;
      proxy_read_timeout 3600s;    # 1 hour keep-alive for streaming
      proxy_send_timeout 3600s;
    }

    # ── Health / docs ─────────────────────────────────────────
    location /health { proxy_pass http://fraudshield_api; }
    location /docs   { proxy_pass http://fraudshield_api; }
  }
}
