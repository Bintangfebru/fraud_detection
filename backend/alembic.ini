# Alembic Configuration — FraudShield
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the migrations directory
script_location = migrations

# Template used to generate migration file names.
# %(rev)s = revision token, %(slug)s = description slug, %(epoch)s = UNIX timestamp
file_template = %%(epoch)s_%%(rev)s_%%(slug)s

# Truncate length for file_template slug (avoids very long filenames)
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be detected
# as revisions in the versions/ directory
sourceless = false

# Version location — can be a colon-separated list of directories
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/migrations/versions

# Output encoding used when revision files are written from script.py.mako.
output_encoding = utf-8

# sqlalchemy.url is overridden in env.py via settings.database_url_sync
# Leave a placeholder; the env.py reads from pydantic settings instead.
sqlalchemy.url = postgresql://fraudshield_user:fraudshield_pass@localhost:5432/fraudshield


[post_write_hooks]
# Post-write hooks define scripts to be run on newly generated revision scripts.
# See the documentation for further detail and examples
# https://alembic.sqlalchemy.org/en/latest/api/runtime.html#post-write-hooks

# Lint with ruff on generated revision files (optional, comment out if not installed)
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/bin/ruff
# ruff.options = --fix REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
